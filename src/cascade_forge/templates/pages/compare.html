{% extends "base.html" %}
{% block page_title %}叶型比较{% endblock %}
{% block content %}
<section class="surface-card" data-compare-root><form class="inline-form" data-compare-form><label>Geometry IDs（每行一个，首项为基准）<textarea name="ids" rows="3" placeholder="geo_v2_…&#10;geo_v2_…" required></textarea></label><button class="button primary" type="submit">叠加比较</button></form><p class="muted">支持 2–12 个不同叶型，可用换行、空格或逗号分隔；重复 ID 自动去重。坐标按弦长归一化。</p><p data-compare-error role="alert" hidden></p><div class="table-toolbar"><span data-compare-summary role="status">尚未比较</span><button class="button" data-export-comparison disabled>导出比较 CSV</button></div><div id="compare-chart" class="plotly-chart large-chart empty-chart" data-empty="输入至少两个 Geometry ID"></div><div class="table-scroll"><table class="data-table"><thead><tr><th>Geometry ID</th><th>内核</th><th>tmax/c</th><th>xt/c</th><th>最大弯度</th><th>LE r/c</th><th>TE r/c</th><th>Δ tmax/c</th><th>Δ xt/c</th><th>Δ 最大弯度</th></tr></thead><tbody data-compare-body></tbody></table></div></section>
{% endblock %}
