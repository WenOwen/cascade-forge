{% extends "base.html" %}
{% block page_title %}叶型工作室{% endblock %}
{% block toolbar_actions %}<button class="button" type="button" data-import-spec>导入 spec</button><button class="button" type="button" data-export-spec>导出 spec</button><button class="button primary" type="button" data-save-workspace>保存到 Workspace</button>{% endblock %}
{% block content %}
<div class="studio-layout" data-studio-root data-default-spec='{{ default_spec_v2|tojson }}'>
  <aside class="surface-card inspector">
    <div class="segmented"><button class="active" type="button" data-mode="basic">基础</button><button type="button" data-mode="advanced">高级</button></div>
    <form id="studio-form" class="inspector-form">
      <fieldset><legend>曲线内核</legend><label>中弧线<select name="camber_family"><option value="bezier">Bezier</option><option value="bspline">B-spline</option><option value="nurbs">NURBS</option></select></label><label>厚度<select name="thickness_family"><option value="bezier">Bezier</option><option value="bspline" selected>B-spline</option><option value="nurbs">NURBS</option></select></label><label class="switch-row"><span>双侧厚度联动</span><input type="checkbox" name="linked_thickness" checked></label></fieldset>
      <fieldset><legend>气动几何</legend><label>进口金属角 <output data-for="inlet_metal_angle_deg"></output><input type="range" name="inlet_metal_angle_deg" min="20" max="75" step="0.1"></label><label>弯转角 <output data-for="turning_angle_deg"></output><input type="range" name="turning_angle_deg" min="0" max="65" step="0.1"></label><label>最大厚度 t/c <output data-for="max_thickness_ratio"></output><input type="range" name="max_thickness_ratio" min="0.03" max="0.18" step="0.001"></label><label>最大厚度位置 x/c <output data-for="max_thickness_x_ratio"></output><input type="range" name="max_thickness_x_ratio" min="0.20" max="0.65" step="0.005"></label></fieldset>
      <fieldset><legend>边缘与形状</legend><div class="field-pair"><label>LE r/c<input type="number" name="leading_edge_radius_ratio" min="0.0005" max="0.03" step="0.0001"></label><label>TE r/c<input type="number" name="trailing_edge_radius_ratio" min="0.0001" max="0.02" step="0.0001"></label></div><label>尾缘半楔角<input type="number" name="trailing_edge_half_wedge_deg" min="0" max="25" step="0.1"></label><div class="field-pair"><label>前段因子<input type="number" name="fore_shape_factor" min="0.5" max="1.8" step="0.05"></label><label>后段因子<input type="number" name="aft_shape_factor" min="0.5" max="1.8" step="0.05"></label></div></fieldset>
      <fieldset class="advanced-fields" hidden><legend>显式曲线合同</legend><p class="field-help">拖拽中弧线控制点会更新此 JSON；浏览器只提交 spec，不复制几何算法。</p><textarea name="explicit_spec" rows="12" spellcheck="false"></textarea></fieldset>
    </form>
  </aside>
  <section class="studio-main">
    <article class="surface-card canvas-card"><div class="card-heading"><div><p class="eyebrow">LIVE PREVIEW</p><h2>完整叶型轮廓</h2></div><div class="button-row"><span class="pill" data-preview-state>等待计算</span><button class="icon-button" type="button" data-reset-view title="重置视图">↺</button></div></div><div class="chart-frame profile-frame"><div id="profile-chart" class="plotly-chart"></div><svg class="control-overlay" data-control-overlay></svg></div><div class="geometry-meta"><code data-geometry-id>—</code><span data-validation-status class="pill">—</span><span data-intent-id>—</span></div></article>
    <article class="surface-card analysis-card"><div class="tab-list"><button class="active" data-analysis="thickness">厚度</button><button data-analysis="curvature">曲率</button><button data-analysis="gradient">曲率梯度</button><button data-analysis="angle">角度</button></div><div id="analysis-chart" class="plotly-chart analysis-chart"></div></article>
    <div class="edge-grid"><article class="surface-card"><div class="card-heading"><h2>前缘 LE</h2><span data-le-radius class="mono-value">—</span></div><div id="le-chart" class="plotly-chart edge-chart"></div></article><article class="surface-card"><div class="card-heading"><h2>尾缘 TE</h2><span data-te-radius class="mono-value">—</span></div><div id="te-chart" class="plotly-chart edge-chart"></div></article></div>
  </section>
</div>
<dialog id="workspace-dialog"><form method="dialog" class="dialog-form"><h2>保存到 Workspace</h2><label>设计名称<input name="name" value="未命名叶型" required></label><label>标签<input name="tags" placeholder="逗号分隔"></label><div class="button-row"><button class="button" value="cancel">取消</button><button class="button primary" value="save">保存修订</button></div></form></dialog><input type="file" accept="application/json" hidden data-spec-file>
{% endblock %}
