[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cascade-forge"
version = "1.0.0"
description = "可追溯的压气机叶型几何数据库、三维叶片曲面和 GeomTurbo 工具"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.2,<2",
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "numpy>=2.0,<3",
  "plotly>=6,<7",
  "pyarrow>=19,<22",
  "pydantic>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "pyyaml>=6.0,<7",
  "scipy>=1.15,<2",
  "typer>=0.15,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "hypothesis>=6.130,<7",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]

[project.scripts]
cascade-forge = "cascade_forge.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/cascade_forge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
