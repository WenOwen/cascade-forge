{% extends "base.html" %}
{% block page_title %}三维叶片{% endblock %}
{% block content %}
<div class="blade-layout" data-blade-root><article class="surface-card"><form data-blade-form class="stack-form"><div class="field-pair"><label>名称<input name="name" value="cascade-forge-blade"></label><label>叶片数<input name="blade_count" type="number" min="1" value="18"></label></div><div class="field-pair"><label>旋转方向<select name="rotation_direction"><option value="ccw">CCW</option><option value="cw">CW</option></select></label><label>输出截面数<input name="output_section_count" type="number" min="2" max="201" value="5"></label></div><div class="card-heading"><h2>Section Schedule</h2><button class="button" type="button" data-add-section>添加截面</button></div><div class="section-editor" data-section-editor></div><button class="button primary" type="submit">构造曲面并导出 GeomTurbo</button></form><div class="result-summary" data-blade-job></div></article><article class="surface-card"><div id="blade-chart" class="plotly-chart blade-chart empty-chart" data-empty="提交 Section Schedule 后显示三维叶片"></div></article></div>
<template id="section-row-template"><div class="section-row"><span class="drag-handle">⋮⋮</span><label>Span<input name="span_fraction" type="number" min="0" max="1" step="0.01"></label><label>半径 m<input name="radius_m" type="number" min="0" step="0.001"></label><label>弦长 m<input name="chord_m" type="number" min="0" step="0.001"></label><label>Geometry ID<input name="geometry_id"></label><label>安装角 °<input name="stagger_deg" type="number" step="0.1"></label><label>Lean m<input name="lean_m" type="number" step="0.001" value="0"></label><label>Sweep m<input name="sweep_m" type="number" step="0.001" value="0"></label><button type="button" class="icon-button danger" data-remove-section>×</button></div></template>
{% endblock %}
